<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060b">
<meta name="robots" content="noindex">
<title>🎁 Surprise</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#07060b;color:#f4efe6;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 80% at 50% 30%,#1d1530 0%,#0b0912 55%,#050408 100%)}
  .glow{position:absolute;width:70vmin;height:70vmin;border-radius:50%;
    background:radial-gradient(circle,rgba(214,170,90,.22),transparent 65%);filter:blur(10px);
    animation:breathe 4s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(1.15);opacity:.7}}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:28px;text-align:center;padding:24px;transition:opacity .6s ease}
  .hidden{opacity:0;pointer-events:none}
  .gone{display:none!important}
  h1{font-weight:300;letter-spacing:.35em;text-transform:uppercase;font-size:clamp(14px,3.6vw,18px);color:#cdb98f}
  #startBtn{position:relative;border:0;cursor:pointer;width:min(62vw,240px);height:min(62vw,240px);border-radius:50%;
    color:#120e05;font-size:clamp(26px,7vw,34px);font-weight:700;letter-spacing:.08em;
    background:radial-gradient(circle at 35% 30%,#ffe9b8,#d6aa5a 55%,#8a6429);
    box-shadow:0 0 0 1px rgba(255,230,180,.4),0 20px 60px rgba(214,170,90,.35),inset 0 -8px 20px rgba(0,0,0,.25);
    animation:pulse 2.2s ease-in-out infinite}
  #startBtn:active{transform:scale(.96)}
  #startBtn::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(214,170,90,.45);
    animation:ring 2.2s ease-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 1px rgba(255,230,180,.5),0 20px 90px rgba(214,170,90,.55),inset 0 -8px 20px rgba(0,0,0,.25)}}
  @keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.35);opacity:0}}
  .hint{font-size:14px;color:#8d8598;letter-spacing:.05em}
  #num{font-size:clamp(140px,48vw,300px);font-weight:200;line-height:1;font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,#fff6e0,#d6aa5a);-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 60px rgba(214,170,90,.25)}
  .pop{animation:pop .9s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes pop{0%{transform:scale(2.2);opacity:0;filter:blur(12px)}35%{opacity:1;filter:blur(0)}100%{transform:scale(1);opacity:.95}}
  #ring{position:absolute;width:min(78vw,360px);height:min(78vw,360px)}
  #ring circle{fill:none;stroke-width:2}
  #ringBg{stroke:rgba(255,255,255,.08)}
  #ringFg{stroke:#d6aa5a;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s linear}
  #sound{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:rgba(7,6,11,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-align:center;padding:24px;
    transition:opacity .5s ease}
  #sound svg{width:min(34vw,150px);height:auto;animation:wiggle 1s ease-in-out infinite}
  @keyframes wiggle{25%{transform:rotate(-6deg) scale(1.05)}75%{transform:rotate(6deg) scale(1.05)}}
  #sound .w1,#sound .w2{animation:wave 1s ease-in-out infinite}
  #sound .w2{animation-delay:.25s}
  @keyframes wave{50%{opacity:.2}}
  #sound h2{font-size:clamp(28px,8vw,44px);font-weight:600}
  #sound p{font-size:clamp(18px,5vw,24px);color:#cdb98f}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}
  .flash{animation:flash .9s ease-out}
  @keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
  .curtain{position:fixed;top:0;bottom:0;width:50.5%;z-index:25;pointer-events:none;
    background:linear-gradient(90deg,#2a0d18,#5a1a2c 40%,#2a0d18);box-shadow:0 0 40px rgba(0,0,0,.7)}
  #cL{left:0;transform:translateX(-101%)} #cR{right:0;transform:translateX(101%)}
  .closeC #cL,.closeC #cR{transform:translateX(0);transition:transform .35s ease-in}
  .openC #cL{transform:translateX(-101%);transition:transform 1.1s cubic-bezier(.7,0,.2,1)}
  .openC #cR{transform:translateX(101%);transition:transform 1.1s cubic-bezier(.7,0,.2,1)}
  #vwrap{position:fixed;inset:0;z-index:20;background:#000;display:flex;align-items:center;justify-content:center;
    opacity:0;transform:scale(.6);transition:opacity .8s ease,transform 1s cubic-bezier(.2,.9,.3,1.1)}
  #vwrap.show{opacity:1;transform:scale(1)}
  #vwrap.offstage{visibility:hidden}
  video{width:100%;height:100%;object-fit:contain;background:#000}
  #confetti{position:fixed;inset:0;width:100%;height:100%;z-index:28;pointer-events:none}
  #replay{position:fixed;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
    z-index:40;border:1px solid rgba(255,230,180,.5);background:rgba(10,8,14,.7);color:#f4efe6;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:14px 26px;border-radius:999px;font-size:16px;
    letter-spacing:.04em;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .5s,transform .5s}
  #replay.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
  #unmute{position:fixed;top:max(16px,env(safe-area-inset-top));right:16px;z-index:41;border:0;border-radius:999px;
    padding:10px 16px;background:rgba(214,170,90,.9);color:#120e05;font-weight:600;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<div id="stage">
  <div class="glow"></div>

  <section id="startScreen" class="screen">
    <h1>Eine kleine Überraschung</h1>
    <button id="startBtn" aria-label="Start">Start</button>
    <div class="hint">Tippen zum Starten · Tap to start</div>
  </section>

  <section id="countScreen" class="screen hidden">
    <svg id="ring" viewBox="0 0 100 100" aria-hidden="true">
      <circle id="ringBg" cx="50" cy="50" r="46"/>
      <circle id="ringFg" cx="50" cy="50" r="46"/>
    </svg>
    <div id="num">10</div>
  </section>

  <section id="sound" class="hidden" aria-live="polite">
    <svg viewBox="0 0 120 100" aria-hidden="true">
      <path d="M10 35h20l28-24v78L30 65H10z" fill="#d6aa5a"/>
      <path class="w1" d="M72 32a25 25 0 0 1 0 36" stroke="#f4efe6" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path class="w2" d="M86 18a45 45 0 0 1 0 64" stroke="#f4efe6" stroke-width="7" fill="none" stroke-linecap="round"/>
    </svg>
    <h2>Turn your sound on 🔊</h2>
    <p>Ton einschalten!</p>
  </section>
</div>

<div id="vwrap" class="offstage">
  <video id="vid" src="video.mp4" playsinline webkit-playsinline preload="auto"></video>
</div>
<canvas id="confetti"></canvas>
<div id="flash"></div>
<div id="cL" class="curtain"></div><div id="cR" class="curtain"></div>
<button id="replay">↻ Nochmal ansehen</button>
<button id="unmute" class="gone">🔊 Ton an</button>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const vid = $('vid'), num = $('num'), ringFg = $('ringFg');
  const START = 10, SOUND_FROM = 6, SOUND_TO = 4;
  const C = 2 * Math.PI * 46;
  ringFg.style.strokeDasharray = C; ringFg.style.strokeDashoffset = 0;
  let running = false;

  function goFullscreen() {
    const el = document.documentElement;
    const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen || el.msRequestFullscreen;
    if (fn) { try { const p = fn.call(el, {navigationUI: 'hide'}); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
  }

  // Unlock media playback inside the tap gesture: play (muted first for safety) then pause right away.
  function primeVideo() {
    vid.muted = false; vid.volume = 1;
    try { vid.load(); } catch (e) {}
    const p = vid.play();
    if (p && p.then) {
      p.then(() => { vid.pause(); vid.currentTime = 0; })
       .catch(() => {
         // fallback: muted priming so at least playback is unlocked
         vid.muted = true;
         const q = vid.play();
         if (q && q.then) q.then(() => { vid.pause(); vid.currentTime = 0; }).catch(() => {});
       });
    } else { vid.pause(); }
  }

  function setNum(n) {
    num.textContent = n;
    num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop');
    ringFg.style.strokeDashoffset = C * (1 - n / START);
    if (navigator.vibrate && n <= 3 && n > 0) navigator.vibrate(30);
  }

  function start() {
    if (running) return; running = true;
    goFullscreen();
    primeVideo();
    $('startScreen').classList.add('hidden');
    $('countScreen').classList.remove('hidden');
    let n = START; setNum(n);
    const t = setInterval(() => {
      n--;
      if (n === SOUND_FROM) $('sound').classList.remove('hidden');
      if (n === SOUND_TO - 1) $('sound').classList.add('hidden');
      if (n <= 0) { clearInterval(t); setNum(0); reveal(); return; }
      setNum(n);
    }, 1000);
  }

  function reveal() {
    document.body.classList.add('closeC');
    setTimeout(() => {
      $('flash').classList.remove('flash'); void $('flash').offsetWidth; $('flash').classList.add('flash');
      $('countScreen').classList.add('hidden');
      $('vwrap').classList.remove('offstage');
      requestAnimationFrame(() => $('vwrap').classList.add('show'));
      play(true);
      document.body.classList.remove('closeC'); document.body.classList.add('openC');
      confetti();
      setTimeout(() => document.body.classList.remove('openC'), 1300);
    }, 380);
  }

  function play(fromStart) {
    if (fromStart) { try { vid.currentTime = 0; } catch (e) {} }
    vid.muted = false;
    const p = vid.play();
    if (p && p.catch) p.catch(() => {
      // Browser refused sound: play muted and offer an unmute button
      vid.muted = true; vid.play().catch(() => {});
      $('unmute').classList.remove('gone');
    });
    if (vid.muted) $('unmute').classList.remove('gone');
  }

  $('unmute').addEventListener('click', () => { vid.muted = false; vid.play().catch(()=>{}); $('unmute').classList.add('gone'); });
  vid.addEventListener('ended', () => $('replay').classList.add('show'));
  vid.addEventListener('play', () => $('replay').classList.remove('show'));
  $('replay').addEventListener('click', () => {
    goFullscreen(); $('replay').classList.remove('show'); confetti(); play(true);
  });
  $('startBtn').addEventListener('click', start);

  // --- tiny hand-written confetti ---
  const cv = $('confetti'), ctx = cv.getContext('2d');
  let parts = [], raf = null;
  function resize() { const d = window.devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; ctx.setTransform(d,0,0,d,0,0); }
  addEventListener('resize', resize); resize();
  const COLORS = ['#d6aa5a','#ffe9b8','#ff5d8f','#7ad7ff','#b48cff','#ffffff','#6dffb3'];
  function confetti() {
    const w = innerWidth, h = innerHeight;
    for (let i = 0; i < 220; i++) {
      const a = Math.random() * Math.PI * 2, s = 6 + Math.random() * 12;
      parts.push({x: w/2, y: h/2, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 6, g: .28 + Math.random()*.15,
        w: 6 + Math.random()*7, h: 8 + Math.random()*10, r: Math.random()*6, vr: (Math.random()-.5)*.4,
        c: COLORS[i % COLORS.length], life: 0, max: 120 + Math.random()*80});
    }
    if (!raf) loop();
  }
  function loop() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life < p.max && p.y < innerHeight + 40);
    for (const p of parts) {
      p.life++; p.vx *= .985; p.vy = p.vy * .985 + p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - p.life / p.max);
      ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.scale(1, Math.cos(p.life * .2));
      ctx.fillStyle = p.c; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.restore();
    }
    raf = parts.length ? requestAnimationFrame(loop) : (ctx.clearRect(0,0,innerWidth,innerHeight), null);
  }
})();
</script>
</body>
</html>
